<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR Menu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<section class="hero">
  <div class="hero-overlay"></div>

  <div class="hero-inner">
    <!-- OPTIONAL: agar tum logo image use karna chahte ho -->
    <!-- <img src="images/hero/logo.png" class="hero-logo" alt="Pranam Pure Veg"> -->

    <h1>AR PURE VEG</h1>
    <p>Pure • Hygienic • Jain Friendly</p>
  </div>
</section>

<!-- SEARCH BAR -->
<div class="search-box">
  <input
    type="text"
    id="searchInput"
    placeholder="Search dishes..."
  />
</div>

<section id="categories" class="menu"></section>

<div class="cart" id="cart">
  🛒 <span id="count">0</span> Items
</div>
<!-- CART MODAL -->
<div id="cartModal" class="cart-modal">
  <div class="cart-box">
    <h2>Your Order</h2>

    <div id="cartItems"></div>

    <div class="cart-total">
      Total: ₹<span id="totalPrice">0</span>
    </div>

    <div class="cart-actions">
      <button onclick="closeCart()">Close</button>
      
    </div>
  </div>
</div>
<!-- ITEM DETAIL MODAL -->
<div id="itemModal" class="item-modal">
  <div class="item-box">
    <img id="itemImg" src="" alt="Dish Image">

    <h3 id="itemName"></h3>

    <p class="ingredients" id="itemIngredients"></p>

    <p class="serves" id="itemServes"></p>

    <p class="price">₹<span id="itemPrice"></span></p>

    <div class="qty-control">
      <button id="modalMinus">−</button>
      <span id="modalQty">1</span>
      <button id="modalPlus">+</button>
    </div>

    <button class="add-cart-btn" id="addToCartBtn">
      Add to Cart
    </button>

    <button class="close-btn" onclick="closeItemModal()">Close</button>
  </div>
</div>
<div class="thank-you premium">
  <div class="thank-box">
    <h2>🙏 Thank You for Dining With Us</h2>

    <p class="tagline">
      We hope you enjoyed our carefully crafted menu.
    </p>

    <div class="divider"></div>

    <p class="subtext">
      Fresh • Hygienic • Delicious
    </p>

    <p class="visit">
      Visit Again ✨
    </p>
  </div>
</div>


<script src="categories.js"></script>
<script src="script.js"></script>
</body>
</html>
